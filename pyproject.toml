[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-ayinbox"
dynamic = ["version"]
description = "LlamaIndex tool spec for AY Inbox, built from the API's agent tool catalogue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AY Inbox", email = "team@ayinbox.com" }]
keywords = ["ayinbox", "llama-index", "agents", "tools", "cold email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["llama-index-core>=0.13.0,<0.15", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://ayinbox.com"
Documentation = "https://docs.ayinbox.com/api/agent-tools/"
Source = "https://github.com/ayinbox/llama-index-tools-ayinbox"
Changelog = "https://github.com/ayinbox/llama-index-tools-ayinbox/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "llama-index-llms-openai>=0.6,<1",
    "mypy==2.4.1",
    "ruff==0.17.5",
]

[tool.hatch.version]
path = "llama_index/tools/ayinbox/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.hatch.build.targets.sdist]
include = ["llama_index", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["llama_index.tools.ayinbox"]

[tool.mypy]
strict = true
explicit_package_bases = true
files = ["llama_index/tools/ayinbox", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
